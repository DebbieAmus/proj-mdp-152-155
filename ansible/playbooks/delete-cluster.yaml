---
- name: Delete Kubernetes Cluster using Kops
  hosts: master
  become: yes
  vars:
    cluster_name: mycluster.k8s.local
    state_store: s3://my-kops-state-store
  tasks:
    - name: Delete cluster
      shell: |
        export KOPS_STATE_STORE={{ state_store }}
        export AWS_DEFAULT_REGION=us-east-1
        kops delete cluster --name={{ cluster_name }} --yes
      environment:
        KOPS_STATE_STORE: "{{ state_store }}"
